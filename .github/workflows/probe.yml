name: Prueba smart money
on:
  push:
    branches: [main]
    paths: ["scripts/fetch_smart.py", ".github/workflows/probe.yml"]
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: python scripts/fetch_smart.py
      - run: python -c "import json;d=json.load(open('data/smart.json'));print('consenso',d['consenso'][:8]);print('congreso',d['congreso'][:8]);print('act',d['actividad'][:3])"
