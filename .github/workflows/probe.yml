name: Prueba noticias
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          python - <<'PY'
          import urllib.request, re
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          for u in ["https://feeds.finance.yahoo.com/rss/2.0/headline?s=AAPL&region=US&lang=en-US",
                    "https://news.google.com/rss/search?q=%22Apple%20Inc%22%20AAPL%20when:30d&hl=en-US&gl=US&ceid=US:en",
                    "https://news.google.com/rss/search?q=%22Banco%20Santander%22%20when:30d&hl=es&gl=ES&ceid=ES:es"]:
              try:
                  b=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30).read().decode("utf-8","replace")
                  items=re.findall(r"<item>(.*?)</item>",b,re.S); print("OK",u[:60],len(items))
                  for it in items[:3]:
                      print("  ",re.search(r"<title>(.*?)</title>",it,re.S).group(1)[:120],"|",(re.search(r"<pubDate>(.*?)</pubDate>",it) or [None,""])[1])
              except Exception as e: print("ERR",u[:60],e)
          PY
