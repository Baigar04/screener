name: Actualizar datos y publicar

on:
  schedule:
    # Lunes a viernes, 21:45 UTC (22:45 en Madrid en invierno, 23:45 en verano), tras el cierre de EE. UU.
    - cron: "45 21 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Datos macro
        run: python scripts/fetch_macro.py
      - name: Acciones, sectores y técnico
        continue-on-error: true
        run: python scripts/fetch_equities.py
      - name: Smart money (Dataroma y Congreso)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python scripts/fetch_smart.py
      - name: Puntuación de oportunidad
        continue-on-error: true
        run: python scripts/score.py
      - name: Si falla alguna fuente, conservar los datos publicados
        run: |
          for f in universe.json sectors.json fund_cache.json smart.json smart_cache.json score.json score_hist.json news_cache.json; do
            if [ ! -f "data/$f" ]; then curl -fsSL "https://baigar04.github.io/screener/data/$f" -o "data/$f" || true; fi
          done
      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp -r index.html assets data .nojekyll _site/
          mkdir -p _site/assets/vendor
          curl -fsSL "https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js" -o _site/assets/vendor/lightweight-charts.js \
            || echo "Aviso: no se pudo descargar Lightweight Charts; la web usará la copia de unpkg"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
