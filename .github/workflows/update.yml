name: Actualizar datos y publicar

on:
  schedule:
    # Lunes a viernes, 21:45 UTC (22:45 en Madrid en invierno, 23:45 en verano), tras el cierre de EE. UU.
    - cron: "45 21 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write   # solo para la copia de seguridad del historial en la rama copia-datos
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Pruebas (si fallan, no se publica nada)
        run: python -m pytest -q tests
      - name: Datos macro
        run: python scripts/fetch_macro.py
      - name: Fundamentales SEC «a fecha» (laboratorio)
        continue-on-error: true
        env:
          # Nombre y correo de contacto que exige la SEC: secreto de Actions (Settings → Secrets and variables → Actions → SEC_UA)
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python scripts/fetch_sec.py
      - name: Compras y ventas de directivos (formulario 4 de la SEC)
        continue-on-error: true
        timeout-minutes: 20
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python scripts/fetch_insiders.py
      - name: Acciones, sectores y técnico
        continue-on-error: true
        env:
          TIINGO_KEY: ${{ secrets.TIINGO_KEY }}   # respaldo de precios de EE. UU. si Yahoo falla
        run: python scripts/fetch_equities.py
      - name: Prueba del respaldo de precios con Tiingo (solo al subir cambios)
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          TIINGO_KEY: ${{ secrets.TIINGO_KEY }}
        run: python scripts/check_respaldo.py
      - name: Smart money (Dataroma y Congreso)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python scripts/fetch_smart.py
      - name: Puntuación de oportunidad
        continue-on-error: true
        run: python scripts/score.py
      - name: Si falla alguna fuente, conservar los datos publicados
        run: |
          for f in universe.json sectors.json fund_cache.json smart.json smart_cache.json score.json score_hist.json score_diario.json amplitud.json insiders.json news_cache.json lab.json sec_cache.json lab_extra.json; do
            if [ ! -f "data/$f" ]; then curl -fsSL "https://baigar04.github.io/screener/data/$f" -o "data/$f" \
              || curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/copia-datos/data/$f" -o "data/$f" || true; fi
          done
      - name: Prueba de la validación (solo si existe tests/INYECTAR_CORRUPTO)
        if: hashFiles('tests/INYECTAR_CORRUPTO') != ''
        run: |
          echo "Prueba: se corrompe data/universe.json; la validación debe publicar la última versión válida"
          head -c 5000 data/universe.json > /tmp/u && mv /tmp/u data/universe.json
      - name: Validar antes de publicar (si un fichero no pasa, se publica la última versión válida)
        run: python scripts/validate.py
      - name: Registro inmutable de la nota (una foto por sesión, encadenada; rama copia-datos)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/reg && mkdir -p /tmp/reg && cd /tmp/reg
          git init -q && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin copia-datos 2>/dev/null; then git checkout -q -b copia-datos FETCH_HEAD; else git checkout -q --orphan copia-datos; fi
          python "$GITHUB_WORKSPACE/scripts/registro.py" "$GITHUB_WORKSPACE/data/score.json" registro "$GITHUB_WORKSPACE/data/registro.json" || echo "::warning::El registro inmutable no está íntegro: revisar"
          git add registro
          git -c user.name="github-actions[bot]" -c user.email="41898729+github-actions[bot]@users.noreply.github.com" commit -q -m "Registro $(date -u +%F)" || { echo "Sin sesión nueva"; exit 0; }
          git push -q origin copia-datos
      - name: Copia de seguridad del historial (rama copia-datos; los viernes y al subir cambios)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] && [ "$(date -u +%u)" != "5" ]; then echo "Hoy no toca copia"; exit 0; fi
          set -e
          rm -rf /tmp/copia && mkdir -p /tmp/copia && cd /tmp/copia
          git init -q && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin copia-datos 2>/dev/null; then git checkout -q -b copia-datos FETCH_HEAD; else git checkout -q --orphan copia-datos; fi
          mkdir -p data
          for f in score_hist.json score_diario.json insiders.json smart_cache.json lab.json validacion.json; do
            [ -f "$GITHUB_WORKSPACE/data/$f" ] && cp "$GITHUB_WORKSPACE/data/$f" data/
          done
          printf "# Copia de seguridad del historial del screener\n\nLo que no se puede volver a descargar: registro semanal y diario de la nota, formularios 4 ya leídos, PDF del Congreso ya leídos y laboratorio. En registro/ está el registro inmutable: una foto de la nota por sesión, encadenada con huellas SHA-256 (cadena.json).\nLa genera el workflow los viernes y al subir cambios. Si la web pierde un fichero, el workflow lo recupera de aquí.\n" > LEEME.md
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898729+github-actions[bot]@users.noreply.github.com" commit -q -m "Copia de seguridad $(date -u +%F)" || { echo "Sin cambios"; exit 0; }
          git push -q origin copia-datos
          echo "Copia de seguridad: $(ls data | wc -l) ficheros, $(du -sh data | cut -f1)"
      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp -r index.html assets data .nojekyll _site/
          mkdir -p _site/assets/vendor
          curl -fsSL "https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js" -o _site/assets/vendor/lightweight-charts.js \
            || echo "Aviso: no se pudo descargar Lightweight Charts; la web usará la copia de unpkg"
      - name: Prueba de interfaz con los datos reales (solo al subir cambios)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          pip install -q playwright==1.63.0
          python scripts/check_ui.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
