name: Mantener activa la tarea programada

# GitHub desactiva las tareas programadas de un repositorio público tras 60 días sin actividad.
# Un commit mensual (solo cambia .github/keepalive) lo evita. Los commits hechos con GITHUB_TOKEN
# no lanzan otros workflows, así que no provoca una actualización extra de datos.
on:
  schedule:
    - cron: "17 6 1 * *"   # día 1 de cada mes, 06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/keepalive.yml"]

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Commit mensual
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Mantenimiento: commit mensual para que GitHub no desactive la actualización programada"
          git push
