        <div class="set-row"><span>Tema</span><button class="icon-btn" id="theme" aria-label="Cambiar entre modo claro y oscuro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg><span id="themeName">Oscuro</span></button></div>
        <div class="set-row"><span>Densidad</span><button class="icon-btn" id="dens" aria-label="Densidad de la información"><span id="densName">Compacta</span></button></div>
        <div class="set-row"><span>Texto</span><button class="icon-btn" id="tsize" aria-label="Tamaño del texto"><b style="font-size:15px">A</b><b style="font-size:11px">a</b> <span>normal / grande</span></button></div>
      </div>
    </div>
  </div>
